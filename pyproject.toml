[project]
name = "emporio-agent"
version = "0.1.0"
description = "Atendimento da Empório da Música"
requires-python = ">=3.11"
dependencies = ["openai>=1.66,<3", "python-dotenv>=1.0", "tzdata>=2025.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
