[project]
name = "emporio-agent"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música (function calling + RAG leve sobre políticas)"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
